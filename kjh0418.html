<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 결과 리포트 | 랑이쌤컴퓨터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#D3E4F7;--navy-ink:#51648B;--yellow:#FCEEC5;--yellow-ink:#D9A94A;--pink:#F7DCE5;--pink-ink:#C97D9A;--green:#DAEED4;--paper:#FFFCF6;--paper-2:#FFF6E9;--line:#ECE4D6;--text:#55524A;--muted:#A79F8E;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;line-height:1.6;}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px;}
  .hero{background:var(--navy);color:var(--navy-ink);border-radius:28px;padding:36px 28px 30px;position:relative;overflow:hidden;margin-bottom:22px;}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;background:var(--yellow);border-radius:50%;opacity:.6;}
  .hero::before{content:"";position:absolute;left:-30px;bottom:-60px;width:150px;height:150px;background:var(--pink);border-radius:50%;opacity:.55;}
  .eyebrow{font-size:13px;letter-spacing:.06em;color:var(--navy-ink);font-weight:700;margin-bottom:6px;position:relative;z-index:1;}
  .hero h1{font-weight:800;font-size:30px;margin:0 0 4px;position:relative;z-index:1;}
  .hero .course{font-size:16px;opacity:.85;margin-bottom:4px;position:relative;z-index:1;}
  .teacher-note{margin-top:20px;background:rgba(255,255,255,.55);border-left:4px solid var(--yellow-ink);border-radius:10px;padding:14px 16px;font-size:14.5px;position:relative;z-index:1;}
  .teacher-note b{color:var(--pink-ink);font-weight:700;}
  section{margin-top:34px;}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .sec-badge{font-weight:800;font-size:14px;color:var(--navy-ink);background:var(--navy);border-radius:10px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sec-title{font-weight:700;font-size:19px;color:var(--navy-ink);}
  .timeline{position:relative;padding-left:26px;}
  .timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:3px;background:repeating-linear-gradient(to bottom,var(--yellow-ink) 0 8px,transparent 8px 14px);border-radius:2px;opacity:.6;}
  .t-item{position:relative;padding-bottom:20px;}
  .t-item:last-child{padding-bottom:0;}
  .t-item::before{content:attr(data-n);position:absolute;left:-26px;top:0;width:20px;height:20px;background:var(--green);color:var(--navy-ink);font-size:11px;font-weight:800;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .t-item .topic{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;}
  .t-item .topic b{color:var(--navy-ink);}
  .artifact{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px;}
  .artifact img, .artifact video{width:100%;display:block;background:var(--paper-2);max-height:360px;object-fit:cover;}
  .media-frame{width:100%;height:280px;border:none;display:block;background:#000;}
  .artifact .no-img{width:100%;height:150px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;}
  .artifact-body{padding:14px 16px;}
  .artifact-body .title{font-weight:700;font-size:15px;color:var(--navy-ink);margin-bottom:6px;}
  .artifact-body .comment{font-size:14px;color:var(--text);}
  .artifact-body .comment::before{content:"💬 ";}
  .dl-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 14px;border-radius:20px;background:var(--green);color:var(--navy-ink);text-decoration:none;font-size:13px;font-weight:700;}
  .dl-btn:hover{filter:brightness(0.97);}
  .dl-all{margin-bottom:14px;}
  .attitude-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .att-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .att-card .label{font-size:13px;color:var(--muted);margin-bottom:4px;}
  .stars{color:var(--yellow-ink);font-size:16px;letter-spacing:1px;}
  .stars .off{color:var(--line);}
  .att-comment{background:var(--paper-2);border-radius:12px;padding:14px 16px;font-size:14.5px;}
  .next-box{background:#fff;border:2px dashed var(--pink-ink);border-radius:16px;padding:16px 18px;margin-bottom:12px;}
  .next-box .h{font-weight:700;color:var(--pink-ink);font-size:14.5px;margin-bottom:6px;}
  .next-box p{margin:0;font-size:14.5px;}
  footer{text-align:center;margin-top:44px;font-size:12.5px;color:var(--muted);}
  footer .brand-logo{max-height:36px;max-width:180px;margin-bottom:4px;}
  .empty-note{text-align:center;padding:60px 20px;color:var(--muted);}
  @media (max-width:420px){.hero h1{font-size:26px;}.attitude-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const reportData = {
  "kjh0418": {
    "name": "김주혜",
    "course": "엔트리 코딩(초등)",
    "totalSessions": 6,
    "teacherSummary": "엔트리에 대한 기본 지식이 있고 흥미가 있으며 수업 내용을 빠르게 이해하고 새로운 개념도 자연스럽게 받아들이는 모습을 보였습니다. 단순히 결과를 따라 하는 것이 아니라 원리를 이해하려는 태도가 돋보였으며, 앞으로의 학습에서도 안정적인 성장이 기대됩니다.",
    "curriculum": [
      {
        "n": 1,
        "topic": "순차 실행와 이벤트 처리 - 단순히 블록을 연결하는 것이 아니라 프로그램의 실행 흐름을 이해하고 사용자와 상호작용하는 구조를 설계하는 경험을 할 수 있었습니다."
      },
      {
        "n": 2,
        "topic": "장면으로 이야기 만들기 - 장면(Scene), 이벤트 연결, 스토리 구성 : 스토리를 논리적으로 구성하는 과정에서 순서 구성 능력과 창의적인 표현력, 디지털 콘텐츠 제작 능력을 함께 향상시켰습니다."
      },
      {
        "n": 3,
        "topic": "반복과 무작위 - 반복문, 랜덤(Random) : 랜덤으로 움직이는 캐릭터와 반복 동작이 적용된 미니 게임 제작"
      },
      {
        "n": 4,
        "topic": "변수와 신호 - 데이터 저장 및 변경, 객체 간 통신 : 변수를 활용하여 프로그램이 현재 상태를 기억하고 변화시키는 원리를 이해하였습니다. 이를 통해 데이터를 체계적으로 관리하는 능력과 프로그램의 구조를 이해하는 사고력을 함께 기를 수 있었습니다."
      },
      {
        "n": 5,
        "topic": "조건으로 판단하기 - 조건문, 비교, 판단 : 논리적으로 조건을 분석하고 상황에 맞는 결과를 설계하는 경험을 통해 문제 해결 능력과 논리적 사고력을 향상시켰습니다."
      },
      {
        "n": 6,
        "topic": "나만의 퀴즈 게임 - 지금까지 배운 프로그래밍 개념을 종합하여 하나의 프로젝트를 직접 설계하고 구현"
      }
    ],
    "allDownloadUrl": "https://drive.google.com/file/d/1D0cMnj-3bbM7dDiPbn3dybLzm1nVlubv/view?usp=sharing",
    "artifacts": [
      {
        "title": "분리수거 - 중등 수행평가",
        "mediaType": "video",
        "media": "https://drive.google.com/file/d/1tlifeZm6nOV4ER-PmDyZp9gkgyNSWSu_/view?usp=sharing",
        "comment": "기본 개념들을 알고 있어서 난이도를 높여서 실제 중등 정보 교과에서 나오는 수행평가를 만들어 보았습니다."
      },
      {
        "title": "틀린 그림찾기 게임",
        "mediaType": "video",
        "media": "https://drive.google.com/file/d/1V7s_kzntV_me7JEBxr5hpROws38DXeV0/view?usp=sharing",
        "comment": "모양 수정과 함께 오브젝트와 배경을 함께 다룰 수 있는 기술을 이용하여 만즌 게임"
      },
      {
        "title": "숨은 그림 찾기",
        "mediaType": "image",
        "media": "https://drive.google.com/file/d/1fM2cZHRkKbTCJq-l8c6BcmeVd9lXMPdL/view?usp=sharing",
        "comment": "아이디어가 돋보이는 작품"
      }
    ],
    "attitude": {
      "focus": 5,
      "participation": 5,
      "homework": 5,
      "teamwork": 5,
      "comment": "실습 과정에서 발생한 오류를 스스로 분석하고 수정하는 경험을 반복하면서 디버깅에 대한 자신감이 향상되었습니다. 오류를 두려워하지 않고 해결 과정 자체를 학습으로 받아들이는 태도가 매우 좋았습니다."
    },
    "next": {
      "recommend": "엔트리를 활용한 리스트, 복제, 함수를 경험해 보는 걸 추천합니다.\n엔트리의 고급 기술이며 향후 텍스트 코딩으로 진행하기 위한 필수 과정입니다.",
      "home": "본인이 만들고 싶은 거 보다는 어떤 목표를 두고 고급 기술을 적용해 보길 추천합니다."
    }
  }
};
function starRow(score, max=5){let h="";for(let i=1;i<=max;i++){h+=`<span class="${i<=score?'':'off'}">★</span>`;}return `<span class="stars">${h}</span>`;}
function driveFileId(url){const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/); return m ? m[1] : null;}
function toImageSrc(url){const id = driveFileId(url); return id ? `https://lh3.googleusercontent.com/d/${id}` : url;}
function toVideoEmbed(url){const id = driveFileId(url); return id ? `https://drive.google.com/file/d/${id}/preview` : url;}
function render(id){
  const app = document.getElementById('app');
  const d = reportData[id];
  if(!d){app.innerHTML = '<div class="empty-note">해당 학생의 리포트를 찾을 수 없어요.<br>주소의 학생 코드(?id=)를 확인해주세요.</div>';return;}
  const curriculumHtml = d.curriculum.map(c => `<div class="t-item" data-n="${c.n}"><div class="topic"><b>${c.n}차시</b> · ${c.topic}</div></div>`).join('');
  const artifactsHtml = d.artifacts.map(a => `<div class="artifact">${a.mediaType === 'video' ? (a.media ? `<iframe class="media-frame" src="${toVideoEmbed(a.media)}" allow="autoplay" allowfullscreen></iframe>` : '<div class="no-img">결과물 동영상</div>') : (a.media ? `<img src="${toImageSrc(a.media)}" alt="${a.title}">` : '<div class="no-img">결과물 이미지</div>')}<div class="artifact-body"><div class="title">${a.title}</div><div class="comment">${a.comment}</div></div></div>`).join('');
  app.innerHTML = `
    <div class="hero">
      <div class="eyebrow">SUMMER SPECIAL CLASS REPORT</div>
      <h1>${d.name} 학생 수업 리포트</h1>
      <div class="course">${d.course}</div>
      <div class="teacher-note"><b>선생님 한마디</b><br>${d.teacherSummary}</div>
    </div>
    <section><div class="sec-head"><div class="sec-badge">1</div><div class="sec-title">무엇을 배웠나요?</div></div><div class="timeline">${curriculumHtml}</div></section>
    <section><div class="sec-head"><div class="sec-badge">2</div><div class="sec-title">우리 아이의 결과물</div></div>${d.allDownloadUrl ? `<a class="dl-btn dl-all" href="${d.allDownloadUrl}" target="_blank" rel="noopener">⬇ 결과물 전체 다운로드</a>` : ''}${artifactsHtml}</section>
    <section>
      <div class="sec-head"><div class="sec-badge">3</div><div class="sec-title">수업참여</div></div>
      <div class="attitude-grid">
        <div class="att-card"><div class="label">수업집중도</div>${starRow(d.attitude.focus)}</div>
        <div class="att-card"><div class="label">적극성</div>${starRow(d.attitude.participation)}</div>
        <div class="att-card"><div class="label">미션수행</div>${starRow(d.attitude.homework)}</div>
        <div class="att-card"><div class="label">수업태도</div>${starRow(d.attitude.teamwork)}</div>
      </div>
      <div class="att-comment">${d.attitude.comment}</div>
    </section>
    <section>
      <div class="sec-head"><div class="sec-badge">4</div><div class="sec-title">랑이쌤이 추천합니다.</div></div>
      <div class="next-box"><div class="h">📚 다음 과정 추천</div><p>${d.next.recommend}</p></div>
      <div class="next-box"><div class="h">🏠 가정에서 해 보면 좋은 것</div><p>${d.next.home}</p></div>
    </section>
    <footer><img src="logo.png" alt="랑이쌤컴퓨터" class="brand-logo"></footer>
  `;
}
const params = new URLSearchParams(window.location.search);
const studentId = params.get('id') || Object.keys(reportData)[0];
render(studentId);
</script>
</body>
</html>
